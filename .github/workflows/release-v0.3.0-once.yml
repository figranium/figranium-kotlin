name: One-time Kotlin SDK v0.3.0 release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-v0.3.0-once.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create version tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag v0.3.0 HEAD
          git push origin v0.3.0
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          # v0.3.0

          The Figranium Kotlin and Android SDK now focuses on automation rather than instance administration.

          - Removed authentication, credentials, settings, and interactive browser administration resources.
          - Removed legacy global cookie administration.
          - Retained tasks, templates, executions, schedules, captures, cabinets, and health checks.
          - Breaking API change: administer the Figranium instance through its UI.
          EOF
          gh release create v0.3.0 --title v0.3.0 --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
      - name: Remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/release-v0.3.0-once.yml
          git commit -m 'ci: remove completed Kotlin v0.3.0 release trigger'
          git pull --rebase origin main
          git push origin HEAD:main
