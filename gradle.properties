GROUP=dev.figranium
VERSION_NAME=0.3.0
POM_NAME=Figranium Kotlin SDK
POM_DESCRIPTION=Official Kotlin and Android SDK for the Figranium API.
POM_URL=https://github.com/figranium/figranium-kotlin
POM_SCM_URL=https://github.com/figranium/figranium-kotlin
POM_SCM_CONNECTION=scm:git:git://github.com/figranium/figranium-kotlin.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/figranium/figranium-kotlin.git
POM_LICENCE_NAME=The Apache Software License, Version 2.0
POM_LICENCE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENCE_DIST=repo
POM_DEVELOPER_ID=figranium
POM_DEVELOPER_NAME=Figranium
POM_DEVELOPER_URL=https://github.com/figranium

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
# AppFunctions' KSP processor registers generated sources through Kotlin source
# sets. AGP's built-in Kotlin mode requires this compatibility flag until that
# processor uses the Android source-set API.
android.disallowKotlinSourceSets=false
kotlin.code.style=official
